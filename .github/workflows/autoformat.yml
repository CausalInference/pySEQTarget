name: Auto-format Code

on:
  push:
    branches: [main, devel*]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install formatters
        run: pip install black isort
      
      - name: Format with Black
        run: black .
      
      - name: Sort imports with isort
        run: isort .

      - name: Sync version into CITATION.cff
        run: |
          python - <<'EOF'
          import pathlib, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          cff = pathlib.Path("CITATION.cff")
          text = re.sub(r"^version:.*$", f"version: {version}", cff.read_text(), flags=re.M)
          cff.write_text(text)
          print(f"Synced CITATION.cff to version {version}")
          EOF

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet || (git add -A && git commit -m "Auto-format code")
          git push
